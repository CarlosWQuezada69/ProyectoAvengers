services:
  postgres:
    image: postgres:16-alpine
    container_name: avengers-db
    environment:
      POSTGRES_DB: proyecto_avengers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Debes definir DB_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    container_name: avengers-api
    environment:
      CONNECTIONSTRINGS__DEFAULT: "Host=postgres;Database=proyecto_avengers;Username=postgres;Password=${DB_PASSWORD:?Debes definir DB_PASSWORD en .env}"
      JWT__SECRET: "${JWT_SECRET:?Debes definir JWT_SECRET en .env (mínimo 32 caracteres)}"
      JWT__ISSUER: "ProyectoAvengers"
      JWT__AUDIENCE: "ProyectoAvengers"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Debes definir ADMIN_PASSWORD en .env}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:8080"
      FILESTORAGE__PATH: "/app/uploads"
      FILESTORAGE__URL: "/uploads"
      CORS__ALLOWEDORIGINS__0: "${CORS_ORIGIN:?Debes definir CORS_ORIGIN en .env (ej: https://tudominio.com)}"
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
