<div class="auth-page">
  <div class="auth-bg-grid"></div>
  <div class="auth-bg-glow"></div>

  <div class="auth-card confirm-card">
    <div class="auth-brand-icon">
      <app-brand [showText]="false" />
    </div>

    @if (status === 'loading') {
      <div class="auth-spinner"></div>
      <p class="confirm-message">{{ message }}</p>
    } @else if (status === 'success') {
      <div class="confirm-icon confirm-icon--success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <p class="confirm-message confirm-message--success">{{ message }}</p>
    } @else {
      <div class="confirm-icon confirm-icon--error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </div>
      <p class="confirm-message confirm-message--error">{{ message }}</p>
      <a routerLink="/auth/forgot-password" class="auth-submit" style="display:inline-flex;text-decoration:none;margin-top:8px">Solicitar nuevo enlace</a>
    }
  </div>
</div>
