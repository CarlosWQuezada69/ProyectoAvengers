<footer class="site-footer" id="contacto">
  <div class="container site-footer__grid">
    <div class="site-footer__brand">
      <a class="site-footer__logo" routerLink="/">
        <span>THE AVENGERS <strong>JOYERO</strong></span>
      </a>
      <p class="site-footer__copyright">{{ copyright() }}</p>
      <div class="site-footer__contact">
        <a [href]="'mailto:' + contactEmail()">{{ contactEmail() }}</a>
        <a [href]="'tel:' + contactPhone()">{{ contactPhone() }}</a>
      </div>
    </div>

    <nav class="site-footer__legal" aria-label="Enlaces legales">
      <a routerLink="/acerca">Aviso legal</a>
      <a routerLink="/acerca">Privacidad</a>
    </nav>

    <div class="site-footer__socials">
      <div class="site-footer__social-row">
        <a href="#" aria-label="Facebook" title="Facebook">
          <app-icon name="facebook" size="18"></app-icon>
        </a>
        <a href="#" aria-label="Instagram" title="Instagram">
          <app-icon name="instagram" size="18"></app-icon>
        </a>
        <a href="#" aria-label="YouTube" title="YouTube">
          <app-icon name="youtube" size="18"></app-icon>
        </a>
      </div>
    </div>
  </div>
</footer>
