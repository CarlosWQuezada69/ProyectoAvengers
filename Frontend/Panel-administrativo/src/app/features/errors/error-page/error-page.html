<div class="error-page">
  <div class="error-bg-grid"></div>
  <div class="error-bg-glow"></div>

  <div class="error-card">
    <div class="error-brand">
      <app-brand />
    </div>

    <div class="error-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path [attr.d]="config.icon"/>
      </svg>
    </div>

    <span class="error-code">{{ config.code }}</span>
    <h1 class="error-title">{{ config.title }}</h1>
    <p class="error-message">{{ config.message }}</p>

    <div class="error-actions">
      <a routerLink="/dashboard" class="error-btn error-btn--primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Ir al inicio
      </a>
      <button class="error-btn error-btn--secondary" (click)="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Volver atrás
      </button>
    </div>
  </div>
</div>
