<div class="change-password-page">
  <header class="section-header">
    <h2>Cambiar contraseña</h2>
  </header>

  <div class="password-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="password-form">
      <app-input formControlName="currentPassword" label="Contraseña actual" type="password" [required]="true" placeholder="Tu contraseña actual" />
      <app-input formControlName="newPassword" label="Nueva contraseña" type="password" [required]="true" placeholder="Mínimo 8 caracteres" />
      <app-input formControlName="confirmPassword" label="Confirmar nueva contraseña" type="password" [required]="true" placeholder="Repite la nueva contraseña" />

      @if (form.errors?.['mismatch'] && form.touched) {
        <p class="form-error">Las contraseñas nuevas no coinciden.</p>
      }

      <p class="hint">Al cambiar la contraseña se cerrarán tus demás sesiones y deberás iniciar sesión de nuevo.</p>

      <div class="form-actions">
        <app-btn type="submit" [loading]="saving" [disabled]="form.invalid">Actualizar contraseña</app-btn>
      </div>
    </form>
  </div>
</div>
