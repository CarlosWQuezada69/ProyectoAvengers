<div class="auth-page">
  <div class="auth-bg-grid"></div>
  <div class="auth-bg-glow"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <a routerLink="/auth/login" class="auth-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Volver
      </a>
      <div class="auth-brand-icon">
        <app-brand [showText]="false" />
      </div>
      <h1 class="auth-title">Recuperar contraseña</h1>
      <p class="auth-subtitle">Te enviaremos un enlace para restablecerla</p>
    </div>

    @if (sent) {
      <div class="auth-success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M22 2L11 13"/>
          <path d="M22 2L15 22 11 13 2 9l20-7z"/>
        </svg>
        Si el correo existe, recibirás un enlace de recuperación.
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="auth-field">
        <label class="auth-label" for="email">Correo electrónico</label>
        <div class="auth-input-wrapper">
          <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input
            id="email"
            class="auth-input"
            type="email"
            formControlName="email"
            placeholder="tu@correo.com"
            autocomplete="email"
            spellcheck="false"
          />
        </div>
      </div>

      <button
        class="auth-submit"
        type="submit"
        [disabled]="form.invalid || loading"
      >
        @if (loading) {
          <span class="auth-submit-spinner"></span>
        }
        <span>{{ loading ? 'Enviando…' : 'Enviar enlace' }}</span>
      </button>
    </form>
  </div>
</div>
